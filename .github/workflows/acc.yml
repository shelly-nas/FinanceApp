name: Deploy to Acceptance

# Every pull request to main is built and deployed to
# finance-acc.shelly-nas.nl, so the change can be reviewed in the running app
# before it is merged. There is one acc environment: the last pull request
# pushed is the one on it. "Run workflow" redeploys any branch by hand.
#
# Acc gets a fresh database on every deploy - schema, seed and
# database/seed-demo.sql - and never production data. Nothing here releases
# or touches production; that stays with deploy.yml and the release PR.
#
# When the pull request is merged or closed, acc is torn down - but only if it
# still runs that pull request. Nothing is left running between the merge and
# the release; the release itself is reviewed on production.

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a deploy in progress; acc only ever shows one branch.
# A teardown never cancels a deploy: it waits its turn, and then only removes
# acc if the deploy that ran was this pull request's.
concurrency:
  group: acc-deploy
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  prepare:
    name: Decide whether to deploy
    runs-on: ubuntu-latest
    # Release PRs only bump versions and the changelog; nothing to review on acc.
    # Pull requests from forks never reach the self-hosted runner.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action != 'closed' &&
       !startsWith(github.head_ref, 'release-please--') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=acc-${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"

  build-server:
    name: Build and Push Server
    needs: prepare
    uses: shelly-nas/shared-workflows/.github/workflows/build-push-image.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      image_tag: ${{ vars.REGISTRY_URL }}/finance-app-server:${{ needs.prepare.outputs.tag }}
      context: ./server
    secrets:
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  build-client:
    name: Build and Push Client
    needs: prepare
    uses: shelly-nas/shared-workflows/.github/workflows/build-push-image.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      image_tag: ${{ vars.REGISTRY_URL }}/finance-app-client:${{ needs.prepare.outputs.tag }}
      context: ./client
    secrets:
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  build-db:
    name: Build and Push Database
    needs: prepare
    uses: shelly-nas/shared-workflows/.github/workflows/build-push-image.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      image_tag: ${{ vars.REGISTRY_URL }}/finance-app-db:${{ needs.prepare.outputs.tag }}
      context: ./database
    secrets:
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  deploy-acc:
    name: Deploy to Acceptance
    needs: [prepare, build-server, build-client, build-db]
    uses: shelly-nas/shared-workflows/.github/workflows/deploy-acceptance.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      deploy_directory: /volume1/docker/finance-app-acc
      compose_file: docker-compose.acc.yml
      image_tag: ${{ needs.prepare.outputs.tag }}
      demo_seed_file: database/seed-demo.sql
    secrets:
      registry_username: ${{ vars.REGISTRY_USERNAME }}
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}
      env_file_content: |
        DB_NAME=${{ vars.DB_NAME }}
        DB_USER=${{ vars.DB_USER }}
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        TZ=${{ vars.TZ || 'Europe/Amsterdam' }}

  teardown-acc:
    name: Tear down acc
    if: >-
      github.event.action == 'closed' &&
      !startsWith(github.head_ref, 'release-please--') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: shelly
    env:
      ACC_DIR: /volume1/docker/finance-app-acc
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Every push to a pull request is deployed, so acc runs its head commit -
      # unless another pull request or a manual run has been deployed since.
      # That one is under review and stays.
      - name: Check that acc runs this pull request
        id: check
        run: |
          project=$(basename "$ACC_DIR")
          commit=$(docker ps -a --filter "label=com.docker.compose.project=$project" --format '{{.Image}}' \
            | sed -n 's/.*:acc-\([0-9a-f]\{7,40\}\)$/\1/p' | head -n 1)
          if [ -z "$commit" ]; then
            echo "Acc is not running; nothing to tear down."
          elif [ "$commit" = "$HEAD_SHA" ]; then
            echo "Acc runs this pull request ($commit); tearing it down."
            echo "teardown=true" >> "$GITHUB_OUTPUT"
          else
            echo "Acc runs $commit, not this pull request ($HEAD_SHA); leaving it up."
          fi

      # The same steps as the teardown in the shared production deploy. By
      # compose label rather than `docker compose down`: the .env is deleted
      # after the acc deploy, and the compose file will not load without it.
      - name: Remove acc containers, networks and volumes
        if: steps.check.outputs.teardown == 'true'
        run: |
          project=$(basename "$ACC_DIR")
          docker ps -aq --filter "label=com.docker.compose.project=$project" | xargs -r docker rm -f
          docker network ls -q --filter "label=com.docker.compose.project=$project" | xargs -r docker network rm
          docker volume ls -q --filter "label=com.docker.compose.project=$project" | xargs -r docker volume rm

      # The database files are owned by the postgres user (uid 70), which the
      # runner cannot delete as itself; Docker runs as root and can.
      - name: Remove the acc directory
        if: steps.check.outputs.teardown == 'true'
        run: |
          if [ -d "$ACC_DIR" ]; then
            docker run --rm -v "$ACC_DIR:/acc" alpine find /acc -mindepth 1 -delete
            rmdir "$ACC_DIR"
          fi

      # The acc images are unused now; they can be pulled again if needed.
      - name: Clean up unused images and volumes
        if: steps.check.outputs.teardown == 'true'
        run: |
          docker image prune -af || true
          docker volume ls -q --filter dangling=true | grep -E '^[0-9a-f]{64}$' | xargs -r docker volume rm || true
          docker builder prune -f || true
          docker system df || true
