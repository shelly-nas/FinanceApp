name: CI

# Runs on every change: each push to any branch and every pull request, so a
# problem surfaces before it reaches main rather than at deploy time. The steps
# live in shared-workflows' ci-node-postgres.yml; only what is specific to this app is
# passed in.
on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: shelly-nas/shared-workflows/.github/workflows/ci-node-postgres.yml@main
    with:
      db_user: financier
      db_name: finance
      # Re-running the seed must not duplicate or overwrite categories the
      # user has edited.
      seed_check_table: categories
      # The compiled server resolves its path aliases through module-alias.
      migrate_command: >-
        node -r module-alias/register -e "require('./dist/context/migrations').runMigrations().then(() => process.exit(0)).catch((e) => { console.error(e); process.exit(1); })"
