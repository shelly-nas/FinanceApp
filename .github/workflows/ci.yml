name: CI

# Runs on every change: each push to any branch and every pull request, so a
# problem surfaces before it reaches main rather than at deploy time.
on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.project }}
      - run: npx tsc --noEmit
        working-directory: ${{ matrix.project }}

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: financier
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financier -d finance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: financier
      DB_PASSWORD: ci-password
      DB_NAME: finance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run build
        working-directory: server

      # Migration numbers must be unique. Two branches each adding 004_ merge
      # cleanly in git and then collide in production, where one of the two is
      # recorded as applied and the other silently never runs.
      - name: Check for duplicate migration numbers
        run: |
          duplicates=$(ls server/migrations/[0-9][0-9][0-9]_*.sql \
            | xargs -n1 basename \
            | cut -d_ -f1 \
            | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "Duplicate migration number(s): $duplicates"
            ls server/migrations/
            exit 1
          fi
          echo "Migration numbering is unique."

      # Against an empty database: every migration has to apply from scratch.
      - name: Apply migrations to a fresh database
        working-directory: server
        run: |
          node -e "
            require('module-alias/register');
            require('./dist/context/migrations').runMigrations()
              .then(() => process.exit(0))
              .catch((e) => { console.error(e); process.exit(1); });
          "

      # And a second time: re-running must be a no-op, which is what makes a
      # redeploy of the same version safe.
      - name: Re-run migrations (must be a no-op)
        working-directory: server
        run: |
          node -e "
            require('module-alias/register');
            require('./dist/context/migrations').runMigrations()
              .then(() => process.exit(0))
              .catch((e) => { console.error(e); process.exit(1); });
          "

      - name: Seed categories (twice, must be idempotent)
        working-directory: server
        run: |
          npm run seed
          npm run seed
