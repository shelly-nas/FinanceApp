services:
  db:
    image: postgres:16-alpine
    container_name: finance-app-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-financier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is verplicht in productie}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/initProd.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financier} -d ${POSTGRES_DB:-finance}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    image: ${REGISTRY}/finance-app-server:${IMAGE_TAG:-latest}
    container_name: finance-app-server
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-financier}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-finance}
      SERVER_PORT: 3000
      TZ: ${TZ:-Europe/Amsterdam}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - shelly-network
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance-api.rule=Host(`finance.shelly-nas.nl`) && PathPrefix(`/api`)"
      - "traefik.http.routers.finance-api.entrypoints=web"
      - "traefik.http.services.finance-api.loadbalancer.server.port=3000"

  client:
    image: ${REGISTRY}/finance-app-client:${IMAGE_TAG:-latest}
    container_name: finance-app-client
    restart: always
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
    depends_on:
      - server
    networks:
      - shelly-network
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance.rule=Host(`finance.shelly-nas.nl`)"
      - "traefik.http.routers.finance.entrypoints=web"
      - "traefik.http.services.finance.loadbalancer.server.port=80"

volumes:
  pgdata:
    driver: local

networks:
  shelly-network:
    external: true
