services:
  db:
    image: ${REGISTRY}/finance-app-db:${IMAGE_TAG:-latest}
    container_name: finance-app-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-financier}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is verplicht in productie}
      POSTGRES_DB: ${DB_NAME:-finance}
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      # Bind mount: de data leeft op de host onder ${DATA_DIR}/postgres en
      # overleeft daarmee ook `docker compose down -v`, dat named volumes wist.
      # Het pad moet op de host bestaan en eigendom zijn van uid/gid 70
      # (de postgres-user in het alpine-image), anders weigert Postgres te starten.
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER:-financier} -d ${DB_NAME:-finance}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    image: ${REGISTRY}/finance-app-server:${IMAGE_TAG:-latest}
    container_name: finance-app-server
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-financier}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-finance}
      SERVER_PORT: 3000
      TZ: ${TZ:-Europe/Amsterdam}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - shelly-network
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance-api.rule=Host(`finance.shelly-nas.nl`) && PathPrefix(`/api`)"
      - "traefik.http.routers.finance-api.entrypoints=web"
      - "traefik.http.services.finance-api.loadbalancer.server.port=3000"

  client:
    image: ${REGISTRY}/finance-app-client:${IMAGE_TAG:-latest}
    container_name: finance-app-client
    restart: always
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
    depends_on:
      - server
    networks:
      - shelly-network
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance.rule=Host(`finance.shelly-nas.nl`)"
      - "traefik.http.routers.finance.entrypoints=web"
      - "traefik.http.services.finance.loadbalancer.server.port=80"

networks:
  shelly-network:
    external: true
