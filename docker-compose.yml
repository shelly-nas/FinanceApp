services:
  client: # Frontend service (nginx serving the built Vite app)
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:80"  # Browse the app at http://localhost:5173
    depends_on:
      - server

  server: # Backend service
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"  # API only - there is no page at http://localhost:3000/
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-financier}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD ontbreekt - zet hem in .env}
      DB_NAME: ${DB_NAME:-finance}
      SERVER_PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  db: # PostgreSQL database
    image: postgres:16-alpine  # Pinned: `latest` breaks an existing data volume on a major upgrade
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-financier}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD ontbreekt - zet hem in .env}
      POSTGRES_DB: ${DB_NAME:-finance}
    volumes:
      # Geen init-script: het schema komt van de migraties die de server bij
      # het opstarten draait, zodat een bestaande database ze ook krijgt.
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-financier} -d ${DB_NAME:-finance}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
    driver: local
