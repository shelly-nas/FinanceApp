# Acceptance stack: finance-acc.shelly-nas.nl.
#
# Deployed by .github/workflows/acc.yml for every pull request, next to
# production but separate from it: its own directory (/volume1/docker/
# finance-app-acc), container names, Traefik routers and database. The last
# pull request deployed wins.
#
# The images are the same ones production would get, tagged acc-<commit>.
# The database is rebuilt on every deploy: an empty data directory runs
# init.sql and seed.sql from the image, then the workflow loads
# database/seed-demo.sql. No production data reaches acc.
#
# Keep this file in step with docker-compose.prod.yml; the only differences
# should be names, host and this header.
services:
  db:
    # Eigen image: het schema zit erin gebakken, omdat de deploy alleen dit
    # compose-bestand naar de host kopieert en een bind mount naar
    # ./database/ daar niet bestaat.
    image: ${REGISTRY}/finance-app-db:${IMAGE_TAG:?IMAGE_TAG is verplicht}
    container_name: finance-app-acc-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-financier}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is verplicht}
      POSTGRES_DB: ${DB_NAME:-finance}
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      # Bind mount: de data leeft op de host onder ${DATA_DIR}/postgres en
      # overleeft daarmee ook `docker compose down -v`, dat named volumes wist.
      # Het pad moet op de host bestaan en eigendom zijn van uid/gid 70
      # (de postgres-user in het alpine-image), anders weigert Postgres te starten.
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER:-financier} -d ${DB_NAME:-finance}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    image: ${REGISTRY}/finance-app-server:${IMAGE_TAG:?IMAGE_TAG is verplicht}
    container_name: finance-app-acc-server
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-financier}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-finance}
      SERVER_PORT: 3000
      TZ: ${TZ:-Europe/Amsterdam}
      NODE_ENV: production  # Same build as production; acc differs only in data and host
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - shelly-network
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance-acc-api.rule=Host(`finance-acc.shelly-nas.nl`) && PathPrefix(`/api`)"
      - "traefik.http.routers.finance-acc-api.entrypoints=web"
      - "traefik.http.services.finance-acc-api.loadbalancer.server.port=3000"

  client:
    image: ${REGISTRY}/finance-app-client:${IMAGE_TAG:?IMAGE_TAG is verplicht}
    container_name: finance-app-acc-client
    restart: always
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
    depends_on:
      - server
    networks:
      - shelly-network
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance-acc.rule=Host(`finance-acc.shelly-nas.nl`)"
      - "traefik.http.routers.finance-acc.entrypoints=web"
      - "traefik.http.services.finance-acc.loadbalancer.server.port=80"

networks:
  shelly-network:
    external: true
